<!DOCTYPE html>
<html>
<head>
<title>Mars Map - Jezero Crater</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  #map { height: 100vh; width: 100%; }
  body { margin: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var map = L.map('map').setView([18.65, 77.45], 10);
  L.tileLayer('https://cartocdn-gusc.global.ssl.fastly.net/opmbuilder/api/v1/map/named/opm-mars-basemap-v0-2/all/{z}/{x}/{y}.png', {
    maxZoom: 12,
    attribution: 'OpenPlanetaryMap'
  }).addTo(map);
  L.marker([18.65, 77.45]).addTo(map)
    .bindPopup("<b>Jezero Crater</b><br>Perseverance Rover Landing Site")
    .openPopup();
  var bounds = [[18.20, 77.00], [19.10, 77.90]];
  L.rectangle(bounds, {color: "#ff7800", weight: 2, fillOpacity: 0.1}).addTo(map);
  map.fitBounds(bounds);
</script>
</body>
</html>
